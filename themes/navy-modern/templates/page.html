{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ SITENAME }}{% endblock %}

{% block content %}
<article>
    {% if page.title and page.slug != 'home' %}
    <header>
        <h1>{{ page.title }}</h1>
    </header>
    {% endif %}
    
    <div class="content">
        {{ page.content }}
    </div>
</article>
{% endblock %}
