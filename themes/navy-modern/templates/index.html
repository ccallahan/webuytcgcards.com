{% extends "base.html" %}

{% block content %}
<section id="content">
    <h2>Articles</h2>
    <ul>
    {% for article in articles %}
        <li><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></li>
    {% else %}
        <li>No articles found.</li>
    {% endfor %}
    </ul>
</section>
{% endblock %}
